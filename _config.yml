# _config.yml (Verified)
title: "Misagh Kordi"
email: "misaghkordi1987@gmail.com"
description: >-
  Personal website showcasing projects, references, and resources on AI, LLMs, and bioinformatics.

# Base configuration (critical for GitHub Pages)
baseurl: ""
url: "https://kordimisagh.github.io"

# Theme
remote_theme: "mmistakes/minimal-mistakes"

# Plugins (verified working set)
plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-remote-theme

# Author info
author:
  name: "Misagh Kordi"
  avatar: "/assets/images/IMG_3932.jpg"
  bio: "Researcher in AI, LLMs, and Bioinformatics"
  location: "California, USA"
  email: "misaghkordi1987@gmail.com"
  github: kordimisagh
  linkedin: https://www.linkedin.com/in/misagh-kordi-752448109/

# Navigation
header_pages:
  - index.md
  - about.md
  - posts.md
  - tags.md
  - archive.md
  - project.md

# Features
show_excerpts: true
search: true

# Tag archives (critical fix)
jekyll-archives:
  enabled: [tags]
  layouts:
    tag: tag
  permalinks:
    tag: '/tags/:name/'
  slugify: false # Convert "YouTube" to "youtube"
# Pagination (verified)
pagination:
  enabled: true
  per_page: 5
  permalink: '/page/:num/'
  title: ':title - page :num'
  sort_field: 'date'
  sort_reverse: true

# Collections (required for archive)
collections:
  posts:
    output: true
    permalink: /:collection/:path/

# Header
header:
  overlay_image: /assets/images/IMG_4965.jpg
  overlay_filter: 0.5
  caption: "Exploring AI and Bioinformatics"

# Analytics (optional)
google_analytics: UA-XXXXXX-Y